# 芒格多元思维模型 / Charlie Munger's Latticework of Mental Models
# 来源：《穷查理宝典》/ Source: Poor Charlie's Almanack

title: 多元模型
description: >
  When facing complex problems, don't rely on a single discipline's framework.
  Instead, invoke core models from multiple disciplines and find their intersections.
  Charlie Munger believed that 80% of wisdom comes from a few major models.

mental_model:
  - "Define the problem clearly: What exactly are you trying to figure out?"
  - "Identify which discipline(s) the problem belongs to: Economics? Psychology? Biology? Physics?"
  - "Invoke the 2-3 most relevant core models from each discipline:"
    - "Economics: Opportunity cost, supply/demand, incentives"
    - "Psychology: Confirmation bias, social proof, loss aversion"
    - "Biology: Evolution, adaptation, survival of the fittest"
    - "Physics: Equilibrium, feedback loops, critical mass"
  - "Look for intersections: Where do multiple models point to the same conclusion?"
  - "Check for contradictions: Where do models disagree? That's where judgment matters most."
  - "Make the decision based on the weight of converging models, not any single one."

context_trigger: >
  When facing a complex, multi-dimensional problem where single-discipline
  analysis feels insufficient. Especially useful for investment decisions,
  strategic planning, and evaluating human behavior.

decision_tree:
  "Problem is purely technical": "Use engineering/physics models; psychology is less relevant"
  "Problem involves human behavior": "Lead with psychology models; economics as supplement"
  "Problem has long time horizons": "Add biology/evolution models for slow-moving dynamics"
  "Models disagree fundamentally": "Identify which model's assumptions are most likely wrong"
  "All models converge": "High confidence — but still check for black swans"

modern_parallel: >
  An investor evaluating a tech startup. Instead of just looking at financials
  (economics model), they also consider: the founder's psychology (are they
  overconfident?), the market's evolutionary stage (is it early or saturated?),
  and network effects (physics: does it hit critical mass?). When all four
  models point to "invest," confidence is high. When they diverge, that's
  where the real analysis begins.

counter_example: >
  Munger himself missed Amazon and Google by over-applying the "circle of
  competence" model. His "no tech stocks" rule came from a reasonable judgment
  about his own cognitive boundaries, but it also became a mental prison.
  The model fails when multiple models converge on the same wrong conclusion
  because they share the same flawed assumption. In the 2008 financial crisis,
  nearly all financial models assumed "housing prices won't decline nationally"
  — multiple models, one shared blind spot.

effectiveness: effective
confidence: 0.85
source_text: >
  "You need a different checklist and different mental models for different
  categories of problems. You need roughly 100 mental models to have a
  latticework in your head."
  — Charlie Munger, Poor Charlie's Almanack
source_citation: >
  Poor Charlie's Almanack: The Wit and Wisdom of Charles T. Munger,
  edited by Peter D. Kaufman, 3rd edition, 2005
