# 明太祖创业三步 / Ming Taizu's Startup Three-Phase Model
# 来源：明史 / Source: Mingshi (History of Ming)

title: 借势立威独行
description: >
  在混乱局面中，先借用强大势力或旗号获得起点，然后在内部树立权威、整顿纪律凝聚人心，
  待时机成熟果断独立发展，破釜沉舟不留退路。
  In a chaotic landscape, first borrow an existing power or banner to get a foothold,
  then build internal authority and discipline to凝聚人心. When the time is ripe,
  cut the cord decisively and go all-in on独立发展 — burn the boats, no retreat.

mental_model:
  - "Borrow momentum to enter: Find an existing power structure, banner, or trend. Attach yourself to it to gain initial legitimacy, resources, and a team."
  - "Build authority internally: During the attachment phase, demonstrate competence, establish discipline, and巧妙 handle relationships. Gradually consolidate decision-making power. Use victories and fairness to win hearts."
  - "Cut the cord and go solo: Once your own strength is solid and external conditions are favorable, judge that your patron can no longer deliver. Sever dependence decisively, bet everything on your core goal, leave no退路."

context_trigger: >
  When you're inside a chaotic platform dominated by others, wanting to build your own
  venture, but lacking an independent foundation.

decision_tree:
  "Is there a usable power structure or banner?": "Attach to it or borrow its name to gain a team and survival space."
  "Have initial team but lack authority?": "Complete key tasks率先, demonstrate decision-making ability, show generosity to win respect. Handle internal disputes with decisive discipline."
  "Wings are full and your patron has become a bottleneck?": "Sever dependence, burn your boats, concentrate forces on the core目标, develop independently."

modern_parallel: >
  An entrepreneur孵化 a new project inside a tech giant: first use the company brand
  and resources to assemble a team (borrow momentum), then establish strict development
  processes and deliver results to win the team's respect (build authority). Once the
  product is validated, lead the team to raise independent funding, break away from the
  parent company (go solo), even burning bridges to go all-in on the new venture.

counter_example: >
  方国珍在元末率先起兵海上，但始终摇摆依附于元朝，满足于接受封赏割据一方，
  从未真正树立独立核心或果断转型，最终在元朝崩溃后失去支撑，被朱元璋以优势力量击破。
  Fang Guozhen was the first to rebel at sea in late Yuan, but始终 wavered between
  allegiances, content with accepting titles and carving out a small territory. He never
  built an independent core or made a decisive pivot. When the Yuan collapsed, he lost
  his support and was crushed by Zhu Yuanzhang's superior forces.

effectiveness: effective
confidence: 0.95
source_text: >
  太祖度无足与共事，乃以兵属他将，独与徐达、汤和等南略定远。
  秘其檄，使人出呼曰："贼至矣！"众惊，太祖乃斩关出。
  剖决如流，众皆失色。甓城皆后期，太祖独先期。
  念林儿势盛，可倚藉，乃用其年号以令军中。
  乃悉断舟缆，放急流中。
source_citation: >
  《明史·太祖本纪》
  Mingshi, Chronicle of Taizu
